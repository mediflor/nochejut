<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --brand:#D7192D; --brand-soft:#fdecee; --ink:#1c2430; --muted:#6b7684; --line:#e6e8ec; --bg:#f6f7f9; --card:#fff;
          --ok:#1f8a4c; --ok-soft:#e5f4ea; --warn:#b26a00; --warn-soft:#fdf2df; --info:#2563a8; --info-soft:#e7f0fb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  header { background:var(--brand); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header svg { width:32px; height:32px; flex:none; }
  header .t { font-weight:700; font-size:17px; }
  header .who { margin-inline-start:auto; font-size:14px; opacity:.9; }
  nav { display:flex; gap:4px; padding:0 16px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto; position:sticky; top:56px; z-index:4; }
  nav button { border:0; background:none; padding:13px 14px; font:inherit; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button.on { color:var(--brand); border-color:var(--brand); font-weight:700; }
  .badge { display:inline-block; min-width:22px; padding:0 7px; margin-inline-start:6px; border-radius:11px; background:var(--brand); color:#fff; font-size:12px; font-weight:700; text-align:center; }
  .badge.z { background:#c9cdd3; }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  h2 { font-size:19px; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 16px; }
  .rule { background:var(--warn-soft); color:#6b4300; border-radius:10px; padding:9px 14px; font-size:14px; margin-bottom:16px; }
  .empty { background:#fff; border:1px dashed var(--line); border-radius:14px; padding:40px; text-align:center; color:var(--muted); }
  table { width:100%; border-collapse:separate; border-spacing:0; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  th { text-align:start; font-size:13px; color:var(--muted); font-weight:600; background:#fafbfc; padding:10px 12px; border-bottom:1px solid var(--line); }
  td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  .name { font-weight:700; }
  .sub { color:var(--muted); font-size:13px; }
  .phone { direction:ltr; unicode-bidi:embed; color:var(--info); text-decoration:none; font-weight:600; white-space:nowrap; }
  .chip { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12.5px; font-weight:600; background:#eef0f3; color:#3d4652; white-space:nowrap; }
  .chip.new { background:var(--ok-soft); color:var(--ok); }
  .chip.rep { background:var(--warn-soft); color:var(--warn); }
  .chip.st { background:var(--info-soft); color:var(--info); }
  .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#c4c9d0; }
  .btn.pri { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:700; }
  .btn.ok { background:var(--ok); color:#fff; border-color:var(--ok); font-weight:700; }
  .btn.ghost { color:var(--muted); }
  .btn:disabled { opacity:.5; cursor:default; }
  .instr { margin-top:4px; font-size:13px; color:#6b4300; background:var(--warn-soft); border-radius:7px; padding:3px 8px; display:inline-block; }
  .note { font-size:13px; color:#3d4652; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .card .n { font-size:26px; font-weight:800; }
  .card .l { color:var(--muted); font-size:13px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:20px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; font:inherit; border:1px solid #cfd4da; border-radius:9px; padding:9px 11px; background:#fff; color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar input { max-width:280px; }
  #modal { position:fixed; inset:0; background:rgba(20,24,30,.45); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  #modal.on { display:flex; }
  #modal .box { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:440px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  #modal h3 { margin:0 0 4px; font-size:18px; }
  #modal .foot { display:flex; gap:8px; justify-content:flex-start; margin-top:16px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1c2430; color:#fff; padding:10px 18px; border-radius:10px; display:none; z-index:30; }
  #toast.err { background:var(--brand); }
  .center { min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); }
  .msg { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .msg.unread { border-color:var(--brand); box-shadow:inset 3px 0 0 var(--brand); }
  .msg .h { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .msg .b { white-space:pre-wrap; margin-top:6px; }
  .alert { background:var(--brand-soft); color:#8a0f1c; border-radius:10px; padding:10px 14px; margin-bottom:16px; font-weight:600; }
  .plan td { padding:8px 10px; }
  .plan input[type=time] { width:120px; }
  .links { display:flex; gap:10px; flex-wrap:wrap; }
  .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .vcard { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  .vcard video { width:100%; display:block; aspect-ratio:16/9; background:#000; }
  .vcard .vt { padding:8px 12px; font-weight:700; }
  .links a { text-decoration:none; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:7px 14px; font:inherit; cursor:pointer; }
  .seg button.on { background:var(--brand); color:#fff; font-weight:700; }
  .ok-chip { background:var(--ok-soft); color:var(--ok); }
  .no-chip { background:var(--brand-soft); color:#8a0f1c; }
  @media (max-width:760px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { border-bottom:1px solid var(--line); padding:8px 0; }
    td { border:0; padding:4px 12px; }
    .acts { justify-content:flex-start; }
    .row2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <svg viewBox="-60 -60 120 120" aria-hidden="true"><defs><path id="h" d="M0 0 C -6 -10 -22 -18 -22 -32 C -22 -42 -14 -48 -7 -48 C -3 -48 0 -45 0 -42 C 0 -45 3 -48 7 -48 C 14 -48 22 -42 22 -32 C 22 -18 6 -10 0 0 Z"></path></defs><g fill="#fff"><use href="#h" transform="rotate(0) translate(0,-5)"></use><use href="#h" transform="rotate(72) translate(0,-5)"></use><use href="#h" transform="rotate(144) translate(0,-5)"></use><use href="#h" transform="rotate(216) translate(0,-5)"></use><use href="#h" transform="rotate(288) translate(0,-5)"></use></g><circle r="9" fill="#D7192D"></circle></svg>
  <div class="t">פורטל הצוות · מדיפלור</div>
  <div class="who" id="who"></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="center">טוען…</div></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
const TOKEN = <?!= JSON.stringify(token) ?>;
const INVALID = <?!= invalid ? 'true' : 'false' ?>;
let ME = null, VIEW = null, ROWS = [], COUNTS = {}, BUSY = false, UNREAD = 0;
const APP_BASE = 'https://mediflor.github.io/nochejut/';

const TABS = [
  { id:'me',       label:'האזור שלי',       role:'*',           count:'unread' },
  { id:'calls',    label:'שיחות',          role:'מתקשר',       count:'calls' },
  { id:'book',     label:'קביעת תורים',     role:'קובעת תורים', count:'book' },
  { id:'followup', label:'סגירת מעגל',      role:'קובעת תורים', count:'followup' },
  { id:'upcoming', label:'תורים קרובים',    role:'קובעת תורים', count:'upcoming' },
  { id:'doctor',   label:'החלטות רופאה',    role:'רופאה',       count:'doctor' },
  { id:'all',      label:'כל הפניות',       role:'מנהל' },
  { id:'manage',   label:'ניהול ונתונים',   role:'מנהל' }
];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy = s => s && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : (s || '');

function call(op, payload) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e)).portalApi(TOKEN, op, payload || {}));
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 5000 : 2500);
}
function canSee(tab) { return tab.role === '*' || ME.roles.indexOf('מנהל') >= 0 || ME.roles.indexOf(tab.role) >= 0; }

function renderNav() {
  $('#nav').innerHTML = TABS.filter(canSee).map(t => {
    const n = t.count ? (t.count === 'unread' ? UNREAD : (COUNTS[t.count] || 0)) : null;
    const b = n === null ? '' : '<span class="badge' + (n ? '' : ' z') + '">' + n + '</span>';
    return '<button data-v="' + t.id + '" class="' + (t.id === VIEW ? 'on' : '') + '">' + t.label + b + '</button>';
  }).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.v));
}

async function go(v) {
  VIEW = v; renderNav();
  try { localStorage.setItem('portal_view', v); } catch (e) {}
  if (v === 'manage') return renderManage();
  if (v === 'me') return renderMe();
  $('#main').innerHTML = '<div class="center">טוען…</div>';
  await reload();
}

async function reload(silent) {
  if (!VIEW || VIEW === 'manage' || VIEW === 'me') return;
  try {
    const r = await call('list', { view: VIEW });
    ROWS = r.rows; COUNTS = r.counts; renderNav(); render();
  } catch (e) { if (!silent) $('#main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

const RULE = '<div class="rule">אין לכתוב במערכת שום מידע רפואי: לא אבחנה, לא סיבה רפואית ולא רקע. רק פרטים תפעוליים.</div>';
function visitChip(p) { return p.visited ? '<span class="chip rep">ביקר ברבעון</span>' : '<span class="chip new">חדש ברבעון</span>'; }
function phone(p) { return p.phone ? '<a class="phone" href="tel:' + esc(p.phone) + '">' + esc(p.phone) + '</a>' : '<span class="sub">לפי התיק במכבי</span>'; }
function who(p) {
  return '<div class="name">' + esc(p.name) + '</div><div class="sub">' + esc(p.id) + ' · ' + esc(p.type) +
    (p.tz ? ' · ת.ז. <span class="phone" style="color:inherit">' + esc(p.tz) + '</span>' : '') + '</div>' +
    (p.instr ? '<div class="instr">הנחיית רופאה: ' + esc(p.instr) + '</div>' : '');
}

function render() {
  const head = {
    calls:    ['שיחות להיום', 'מטופלים להזמנה. מתחילים מהמטופלים החדשים ברבעון. אחרי כל שיחה מסמנים תוצאה.'],
    book:     ['קביעת תורים', 'מטופלים שהסכימו להגיע. מתקשרים, קובעים תור ביומן של ד"ר פלור במכבי ומסמנים כאן.'],
    followup: ['סגירת מעגל', 'תורים שמועדם עבר. מסמנים אם המטופל הגיע.'],
    upcoming: ['תורים קרובים', 'כל התורים שנקבעו ועוד לא הגיע מועדם.'],
    doctor:   ['החלטות רופאה', 'מטופלים שלא היו מעוניינים, לא הושגו או לא הגיעו. מחליטים איך להמשיך.'],
    all:      ['כל הפניות', 'כל הפניות במערכת, מהחדשה לישנה.']
  }[VIEW];
  let h = '<h2>' + head[0] + '</h2><p class="lead">' + head[1] + '</p>';
  if (VIEW === 'calls' || VIEW === 'doctor' || VIEW === 'book') h += RULE;
  if (VIEW === 'calls') h += '<div class="toolbar"><button class="btn pri" id="addPt">➕ הוספת מטופל</button></div>';
  if (VIEW === 'all') h += '<div class="toolbar"><input id="q" placeholder="חיפוש לפי שם, טלפון, ת.ז. או מזהה"></div>';
  if (!ROWS.length) { $('#main').innerHTML = h + '<div class="empty">אין כרגע פניות ברשימה הזו 🌸</div>'; bindAdd(); return; }
  h += '<table><thead><tr>' + cols().map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody id="tb">' + ROWS.map(row).join('') + '</tbody></table>';
  $('#main').innerHTML = h;
  bindRows(); bindAdd();
  if (VIEW === 'all') $('#q').oninput = e => {
    const q = e.target.value.trim();
    document.querySelectorAll('#tb tr').forEach(tr => tr.style.display = !q || tr.textContent.indexOf(q) >= 0 ? '' : 'none');
  };
}

function cols() {
  return {
    calls: ['מטופל', 'טלפון', 'ניסיונות', 'רבעון', ''],
    book: ['מטופל', 'טלפון', 'הערת עמית', 'ניסיונות', ''],
    followup: ['מטופל', 'טלפון', 'תור', ''],
    upcoming: ['מטופל', 'טלפון', 'תור', 'נקבע ע"י'],
    doctor: ['מטופל', 'טלפון', 'מה קרה', 'הסבר', ''],
    all: ['מטופל', 'טלפון', 'סטטוס', 'תור', 'עודכן']
  }[VIEW];
}

function row(p) {
  const id = esc(p.id);
  if (VIEW === 'calls') {
    const acts = p.type === 'חידוש מרשם'
      ? '<button class="btn ok" data-a="internal" data-id="' + id + '">בוצע</button>'
      : '<button class="btn ok" data-a="interested" data-id="' + id + '">מעוניין</button>' +
        '<button class="btn" data-a="noanswer" data-id="' + id + '">לא ענה</button>' +
        '<button class="btn" data-a="notint" data-id="' + id + '">לא מעוניין</button>';
    return '<tr><td>' + who(p) + '</td><td>' + (p.type === 'חידוש מרשם' ? '<span class="chip">משימה פנימית</span>' : phone(p)) + '</td>' +
      '<td>' + p.calls + (p.lastCall ? '<div class="sub">אחרונה ' + esc(dmy(p.lastCall)) + '</div>' : '') + '</td>' +
      '<td>' + visitChip(p) + '</td><td><div class="acts">' + acts + '</div></td></tr>';
  }
  if (VIEW === 'book') {
    return '<tr><td>' + who(p) + '</td><td>' + phone(p) + '</td><td class="note">' + esc(p.note || '—') + '</td>' +
      '<td>' + p.bookTries + '</td><td><div class="acts">' +
      '<button class="btn ok" data-a="booked" data-id="' + id + '">נקבע תור</button>' +
      '<button class="btn" data-a="notreached" data-id="' + id + '">לא הושג</button>' +
      '<button class="btn ghost" data-a="declined" data-id="' + id + '">ויתר</button>' +
      '<button class="btn ghost" data-a="visited" data-id="' + id + '">' + (p.visited ? 'בטל "ביקר ברבעון"' : 'ביקר ברבעון') + '</button>' +
      '</div></td></tr>';
  }
  if (VIEW === 'followup') {
    return '<tr><td>' + who(p) + '</td><td>' + phone(p) + '</td><td>' + esc(dmy(p.apptDate)) + ' ' + esc(p.apptTime) + '</td>' +
      '<td><div class="acts"><button class="btn ok" data-a="arrived" data-id="' + id + '">הגיע</button>' +
      '<button class="btn" data-a="noshow" data-id="' + id + '">לא הגיע</button></div></td></tr>';
  }
  if (VIEW === 'upcoming') {
    return '<tr><td>' + who(p) + '</td><td>' + phone(p) + '</td><td>' + esc(dmy(p.apptDate)) + ' ' + esc(p.apptTime) + '</td><td class="sub">' + esc(p.updBy) + '</td></tr>';
  }
  if (VIEW === 'doctor') {
    const what = p.arrival === 'לא הגיע' ? 'לא הגיע לתור' : (p.callRes === 'לא מעוניין' ? 'לא מעוניין' :
      (p.callRes === 'לא ענה' ? 'לא ענה ' + p.calls + ' פעמים' : (p.bookTries ? 'לא הושג לקביעת תור' : (p.callRes || '—'))));
    return '<tr><td>' + who(p) + '</td><td>' + phone(p) + '</td><td><span class="chip st">' + esc(what) + '</span></td>' +
      '<td class="note">' + esc([p.note, p.bookNote].filter(Boolean).join(' · ') || '—') + '</td><td><div class="acts">' +
      '<button class="btn" data-a="retry" data-id="' + id + '">לנסות שוב</button>' +
      '<button class="btn" data-a="instruct" data-id="' + id + '">הנחיה לעמית</button>' +
      '<button class="btn ok" data-a="tobook" data-id="' + id + '">לקביעת תור</button>' +
      '<button class="btn ghost" data-a="close" data-id="' + id + '">סגירה</button></div></td></tr>';
  }
  return '<tr><td>' + who(p) + '</td><td>' + phone(p) + '</td><td><span class="chip st">' + esc(p.status) + '</span></td>' +
    '<td>' + (p.apptDate ? esc(dmy(p.apptDate)) + ' ' + esc(p.apptTime) : '—') + (p.arrival ? '<div class="sub">' + esc(p.arrival) + '</div>' : '') + '</td>' +
    '<td class="sub">' + esc(dmy(p.updated)) + ' ' + esc((p.updated || '').slice(11)) + '<br>' + esc(p.updBy) + '</td></tr>';
}

function bindRows() {
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a, b.dataset.id));
}

function find(id) { return ROWS.filter(r => r.id === id)[0]; }

// ת.ז. ישראלית – ספרת ביקורת
function tzOk(tz) {
  tz = String(tz || '').replace(/\D/g, '');
  if (tz.length < 5 || tz.length > 9) return false;
  tz = tz.padStart(9, '0'); let s = 0;
  for (let i = 0; i < 9; i++) { let d = +tz[i] * ((i % 2) + 1); s += d > 9 ? d - 9 : d; }
  return s % 10 === 0;
}
function bindAdd() {
  const b = $('#addPt'); if (!b) return;
  b.onclick = () => modal('הוספת מטופל', { name: 'מטופל שדיברת איתו או שצריך להתקשר אליו', id: 'נשמר בפורטל בלבד' }, [
      { k:'name', l:'שם מלא', t:'text', req:true },
      { k:'tz', l:'ת.ז. (9 ספרות)', t:'text', req:true },
      { k:'phone', l:'טלפון (לא חובה)', t:'tel' },
      { k:'type', l:'סוג פנייה', t:'select', o: ME.types.filter(t => t !== 'חידוש מרשם').map(t => [t, t]) },
      { k:'mode', l:'מה הסטטוס?', t:'select', o:[['interested','דיברתי – מעוניין, להעביר לרחלי'],['hasappt','כבר יש לו תור – לבצע כשמגיע'],['tocall','עוד לא דיברתי – להוסיף לשיחות']] },
      { k:'note', l:'הערה לרחלי (לא חובה) – ללא מידע רפואי', t:'text' }],
    v => {
      if (!tzOk(v.tz)) { toast('מספר ת.ז. לא תקין – בדקו את הספרות', true); return; }
      send('addPatient', v, v.mode === 'tocall' ? 'נוסף לרשימת השיחות' : 'הועבר לרחלי לקביעת תור');
    });
}

function act(a, id) {
  const p = find(id); if (!p) return;
  const simple = {
    interested: ['callResult', { id, result:'interested' }, 'הועבר לרחלי לקביעת תור'],
    noanswer:   ['callResult', { id, result:'no_answer' }, 'נשמר. יחזור לרשימה ביום העבודה הבא'],
    internal:   ['callResult', { id, result:'done_internal' }, 'סומן כבוצע'],
    notreached: ['bookResult', { id, result:'not_reached' }, 'נשמר. יחזור ביום העבודה הבא'],
    arrived:    ['arrival', { id, arrived:true }, 'סומן: הגיע'],
    noshow:     ['arrival', { id, arrived:false }, 'הועבר לד"ר פלור'],
    visited:    ['visited', { id, value: !p.visited }, 'עודכן'],
    tobook:     ['doctorDecision', { id, decision:'book' }, 'הועבר לרחלי']
  }[a];
  if (simple) {
    if (a === 'interested') return modal('מעוניין לקבוע תור', p, [{ k:'note', l:'הערה לרחלי (לא חובה) – למשל שעות נוחות', t:'textarea' }],
      v => send('callResult', { id, result:'interested', note:v.note }, 'הועבר לרחלי לקביעת תור'));
    return send(simple[0], simple[1], simple[2]);
  }
  if (a === 'notint') return modal('לא מעוניין', p, [{ k:'note', l:'הסבר קצר (חובה) – ללא מידע רפואי', t:'textarea', req:true }],
    v => send('callResult', { id, result:'not_interested', note:v.note }, 'הועבר לד"ר פלור'));
  if (a === 'booked') return modal('נקבע תור', p, [
      { k:'date', l:'תאריך התור', t:'date', req:true }, { k:'time', l:'שעה', t:'time', req:true },
      { k:'note', l:'הערה (לא חובה)', t:'text' }],
    v => send('bookResult', { id, result:'booked', date:v.date, time:v.time, note:v.note }, 'התור נשמר'));
  if (a === 'declined') return modal('המטופל ויתר על התור', p, [{ k:'note', l:'הסבר קצר (חובה) – ללא מידע רפואי', t:'textarea', req:true }],
    v => send('bookResult', { id, result:'declined', note:v.note }, 'הועבר לד"ר פלור'));
  if (a === 'retry') return modal('לנסות שוב בהמשך', p, [
      { k:'days', l:'בעוד כמה ימים לחזור למטופל?', t:'select', o:[['7','שבוע'],['14','שבועיים'],['30','חודש'],['90','3 חודשים']] },
      { k:'note', l:'הנחיה לעמית (לא חובה)', t:'text' }],
    v => send('doctorDecision', { id, decision:'retry', days:v.days, note:v.note }, 'יחזור לעמית במועד שנבחר'));
  if (a === 'instruct') return modal('הנחיה לעמית', p, [{ k:'note', l:'ההנחיה (תופיע לעמית ליד שם המטופל)', t:'textarea', req:true }],
    v => send('doctorDecision', { id, decision:'instruct', note:v.note }, 'הועבר לעמית עם ההנחיה'));
  if (a === 'close') return modal('סגירת הפנייה', p, [{ k:'note', l:'הערה (לא חובה)', t:'text' }],
    v => send('doctorDecision', { id, decision:'close', note:v.note }, 'הפנייה נסגרה'));
}

function modal(title, p, fields, onOk) {
  $('#mbox').innerHTML = '<h3>' + esc(title) + '</h3><div class="sub">' + esc(p.name) + ' · ' + esc(p.id) + '</div>' +
    fields.map(f => '<label for="f_' + f.k + '">' + esc(f.l) + '</label>' + (
      f.t === 'textarea' ? '<textarea id="f_' + f.k + '" maxlength="300"></textarea>' :
      f.t === 'select' ? '<select id="f_' + f.k + '">' + f.o.map(o => '<option value="' + o[0] + '">' + o[1] + '</option>').join('') + '</select>' :
      '<input id="f_' + f.k + '" type="' + f.t + '" maxlength="300">')).join('') +
    '<div class="foot"><button class="btn pri" id="mok">שמירה</button><button class="btn" id="mcancel">ביטול</button></div>';
  $('#modal').classList.add('on');
  const first = $('#mbox').querySelector('input,textarea,select'); if (first) first.focus();
  $('#mcancel').onclick = closeModal;
  $('#mok').onclick = () => {
    const v = {};
    for (const f of fields) {
      v[f.k] = $('#f_' + f.k).value.trim();
      if (f.req && !v[f.k]) { toast('יש למלא: ' + f.l, true); return; }
    }
    closeModal(); onOk(v);
  };
}
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function send(op, payload, okMsg) {
  if (BUSY) return; BUSY = true;
  document.querySelectorAll('[data-a]').forEach(b => b.disabled = true);
  try { await call(op, payload); toast(okMsg); await reload(); }
  catch (e) { toast(e.message, true); await reload(true); }
  finally { BUSY = false; }
}

async function renderManage() {
  $('#main').innerHTML = '<div class="center">טוען נתונים…</div>';
  let s;
  try { s = await call('stats'); } catch (e) { $('#main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  COUNTS = s.counts; renderNav();
  const card = (n, l) => '<div class="card"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
  $('#main').innerHTML =
    '<h2>ניהול ונתונים</h2><p class="lead">תמונת מצב של כל השרשרת, וייבוא רשימות חדשות.</p>' +
    '<div class="cards">' + card(s.total, 'פניות במערכת') + card(s.counts.calls, 'ממתינות לשיחה') + card(s.counts.book, 'ממתינות לקביעת תור') +
      card(s.counts.doctor, 'ממתינות לד"ר פלור') + card(s.booked, 'תורים שנקבעו') + card(s.newInQuarter, 'תורים למטופלים חדשים ברבעון') +
      card(s.responseRate + '%', 'היענות בשיחות') + card(s.arrivalRate + '%', 'הגעה לתורים') + '</div>' +
    '<div class="panel"><h2>ייבוא רשימה</h2><p class="lead">מדביקים שורה לכל מטופל: <b>שם, טלפון ו/או ת.ז.</b> (אפשר להעתיק עמודות מאקסל). כל מטופל מקבל מזהה פנימי. מטופל שכבר קיים ברשימה פעילה מדולג.</p>' +
      '<div class="row2"><div><label for="imp_type">סוג פנייה</label><select id="imp_type">' + ME.types.map(t => '<option' + (t === 'ביקור' ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>' +
      '<div><label for="imp_list">שם הרשימה</label><input id="imp_list" placeholder="למשל: חיסוני שפעת – נובמבר"></div></div>' +
      '<label for="imp_text">שם, טלפון ו/או ת.ז. – שורה לכל מטופל</label><textarea id="imp_text" style="min-height:160px" placeholder="ישראל ישראלי, 0501234567, 123456782"></textarea>' +
      '<div class="foot" style="margin-top:12px"><button class="btn pri" id="imp_go">ייבוא</button></div><div id="imp_res" class="sub" style="margin-top:8px"></div></div>' +
    '<div id="team"><div class="center" style="min-height:120px">טוען צוות…</div></div>';
  renderTeam($('#team'));
  $('#imp_go').onclick = async () => {
    const text = $('#imp_text').value.trim(); if (!text) return toast('אין שורות לייבוא', true);
    $('#imp_go').disabled = true;
    try {
      const r = await call('importList', { text, type: $('#imp_type').value, listName: $('#imp_list').value });
      $('#imp_res').innerHTML = 'נוספו ' + r.added + ' מטופלים.' + (r.skipped.length ? '<br>דולגו: ' + r.skipped.map(esc).join(' · ') : '');
      $('#imp_text').value = ''; toast('הרשימה נוספה');
      const s2 = await call('stats'); COUNTS = s2.counts; renderNav();
    } catch (e) { toast(e.message, true); }
    finally { $('#imp_go').disabled = false; }
  };
}


/* ====================== האזור שלי ====================== */
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
let AREA = null, PLAN_WEEK = null;

async function renderMe() {
  $('#main').innerHTML = '<div class="center">טוען…</div>';
  try { AREA = await call('myArea'); } catch (e) { $('#main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  UNREAD = AREA.unread; renderNav();
  if (!PLAN_WEEK) PLAN_WEEK = AREA.nextWeek;
  const plan = PLAN_WEEK === AREA.nextWeek ? AREA.planNext : AREA.planCur;
  let h = '<h2>האזור האישי של ' + esc(AREA.name) + '</h2><p class="lead">הודעות מההנהלה, צפי שעות שבועי וקישורים שימושיים.</p>';
  if (AREA.needsPlan && !AREA.planNext.length) h += '<div class="alert">יש להגיש עד מוצאי שבת את צפי שעות העבודה לשבוע שמתחיל ב-' + dmy(AREA.nextWeek) + '.</div>';

  h += '<div class="panel"><h2>הודעות</h2>';
  h += AREA.messages.length ? AREA.messages.map(m =>
    '<div class="msg' + (m.read ? '' : ' unread') + '"><div class="h"><b>' + esc(m.subject) + '</b><span class="sub">' + esc(dmy(m.sent)) + ' ' + esc((m.sent || '').slice(11)) + ' · ' + esc(m.from) + '</span></div>' +
    '<div class="b">' + esc(m.body) + '</div>' + (m.read ? '' : '<div class="acts" style="margin-top:8px;justify-content:flex-start"><button class="btn" data-read="' + esc(m.id) + '">קראתי</button></div>') + '</div>').join('')
    : '<div class="sub">אין הודעות כרגע.</div>';
  h += '</div>';

  if (AREA.needsPlan) {
    const by = {}; plan.forEach(r => { by[r.day] = r; });
    const submitted = plan.length ? plan[0].submitted : '';
    h += '<div class="panel"><h2>צפי שעות עבודה</h2><p class="lead">מסמנים באילו ימים ובאילו שעות מתכננים לעבוד. מגישים כל שבוע עד מוצאי שבת.</p>' +
      '<div class="toolbar"><div class="seg"><button data-wk="' + AREA.nextWeek + '" class="' + (PLAN_WEEK === AREA.nextWeek ? 'on' : '') + '">השבוע הבא (' + dmy(AREA.nextWeek) + ')</button>' +
      '<button data-wk="' + AREA.curWeek + '" class="' + (PLAN_WEEK === AREA.curWeek ? 'on' : '') + '">השבוע הנוכחי</button></div>' +
      (submitted ? '<span class="chip ok-chip">הוגש ' + esc(dmy(submitted)) + ' ' + esc(submitted.slice(11)) + '</span>' : '<span class="chip no-chip">עדיין לא הוגש</span>') + '</div>' +
      '<table class="plan"><thead><tr><th>יום</th><th>עובד/ת?</th><th>משעה</th><th>עד שעה</th><th>הערה</th></tr></thead><tbody>' +
      DAYS.map((d, i) => { const r = by[d]; const dt = addDays(PLAN_WEEK, i);
        return '<tr><td><b>' + d + '</b><div class="sub">' + dmy(dt) + '</div></td><td><input type="checkbox" id="on' + i + '"' + (r ? ' checked' : '') + ' style="width:auto"></td>' +
          '<td><input type="time" id="fr' + i + '" value="' + esc(r ? r.from : '') + '"></td><td><input type="time" id="to' + i + '" value="' + esc(r ? r.to : '') + '"></td>' +
          '<td><input type="text" id="nt' + i + '" maxlength="100" value="' + esc(r ? r.note : '') + '" placeholder="לא חובה"></td></tr>'; }).join('') +
      '</tbody></table><div class="foot" style="margin-top:12px"><button class="btn pri" id="savePlan">הגשת הצפי</button></div></div>';
  }

  const vids = myVideos();
  h += '<div class="panel"><h2>סרטוני הדרכה</h2><p class="lead">הסרטונים של התפקיד שלך. כל אחד פחות מדקה.</p><div class="vgrid">' +
    vids.map(v => '<div class="vcard"><video controls preload="none" poster="' + APP_BASE + 'training/' + v[0] + '.jpg" src="' + APP_BASE + 'training/' + v[0] + '.mp4"></video><div class="vt">' + v[1] + '</div></div>').join('') + '</div></div>';
  h += '<div class="panel"><h2>קישורים</h2><div class="links">' +
    '<a class="btn" target="_blank" href="' + APP_BASE + '?k=' + encodeURIComponent(TOKEN) + '&v=att">שעון הנוכחות</a></div></div>';
  $('#main').innerHTML = h;

  document.querySelectorAll('[data-read]').forEach(b => b.onclick = async () => {
    b.disabled = true; try { await call('markRead', { id: b.dataset.read }); renderMe(); } catch (e) { toast(e.message, true); }
  });
  document.querySelectorAll('[data-wk]').forEach(b => b.onclick = () => { PLAN_WEEK = b.dataset.wk; renderMe(); });
  document.querySelectorAll('[id^=fr],[id^=to]').forEach(inp => inp.oninput = () => { const i = inp.id.slice(2); $('#on' + i).checked = true; });
  const sp = $('#savePlan'); if (sp) sp.onclick = async () => {
    const days = DAYS.map((d, i) => ({ idx: i, on: $('#on' + i).checked, from: $('#fr' + i).value, to: $('#to' + i).value, note: $('#nt' + i).value }));
    sp.disabled = true;
    try { await call('savePlan', { week: PLAN_WEEK, days }); toast('הצפי הוגש. תודה!'); renderMe(); }
    catch (e) { toast(e.message, true); sp.disabled = false; }
  };
}
function myVideos() {
  const R = ME.roles, mgr = R.indexOf('מנהל') >= 0, has = r => mgr || R.indexOf(r) >= 0;
  const v = [['0-attendance', 'שעון נוכחות']];
  if (has('מתקשר')) v.push(['1-amit-calls', 'שיחות למטופלים']);
  if (has('קובעת תורים')) v.push(['2-racheli-booking', 'קביעת תורים וסגירת מעגל']);
  v.push(['3-weekly-plan', 'צפי שעות שבועי והודעות']);
  if (has('רופאה')) v.push(['4-flor-decisions', 'החלטות רופאה']);
  if (mgr) v.push(['5-leo-manage', 'ניהול ונתונים']);
  return v;
}
function addDays(ymd, n) { const p = ymd.split('-').map(Number); const d = new Date(p[0], p[1]-1, p[2]+n, 12); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* ====================== צוות (מנהל) ====================== */
let TEAM_WEEK = null;
async function renderTeam(el) {
  let t;
  try { t = await call('teamArea', { week: TEAM_WEEK }); } catch (e) { el.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  TEAM_WEEK = t.week;
  const workers = t.people.filter(p => p.needsPlan);
  const rowsFor = id => t.plans.filter(r => r.emp === id && r.day !== '—');
  el.innerHTML =
    '<div class="panel"><h2>צפי שעות של הצוות</h2>' +
    '<div class="toolbar"><div class="seg"><button data-tw="' + t.nextWeek + '" class="' + (t.week === t.nextWeek ? 'on' : '') + '">שבוע הבא (' + dmy(t.nextWeek) + ')</button>' +
    '<button data-tw="' + t.curWeek + '" class="' + (t.week === t.curWeek ? 'on' : '') + '">השבוע הנוכחי</button></div></div>' +
    '<table><thead><tr><th>עובד/ת</th><th>סטטוס</th><th>ימים ושעות</th></tr></thead><tbody>' +
    workers.map(p => { const r = rowsFor(p.id); const any = t.plans.some(x => x.emp === p.id);
      return '<tr><td><b>' + esc(p.name) + '</b><div class="sub">' + esc(p.role) + '</div></td><td>' + (any ? '<span class="chip ok-chip">הוגש</span>' : '<span class="chip no-chip">לא הוגש</span>') + '</td>' +
        '<td class="note">' + (r.length ? r.map(x => esc(x.day) + ' ' + esc(x.from) + '–' + esc(x.to) + (x.note ? ' (' + esc(x.note) + ')' : '')).join(' · ') : (any ? 'לא מתוכננת עבודה' : '—')) + '</td></tr>'; }).join('') +
    '</tbody></table></div>' +
    '<div class="panel"><h2>שליחת הודעה לעובדים</h2><p class="lead">ההודעה מופיעה לעובד/ת ב"האזור שלי", עם סימון אדום עד שקוראים.</p>' +
    '<div class="row2"><div><label for="m_to">אל</label><select id="m_to"><option value="כולם">כל הצוות</option>' + t.people.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') + '</select></div>' +
    '<div><label for="m_sub">נושא</label><input id="m_sub" maxlength="120"></div></div>' +
    '<label for="m_body">תוכן</label><textarea id="m_body" maxlength="2000"></textarea>' +
    '<div class="foot" style="margin-top:12px"><button class="btn pri" id="m_send">שליחה</button></div>' +
    (t.messages.length ? '<h2 style="margin-top:18px">נשלחו לאחרונה</h2>' + t.messages.map(m => '<div class="sub">' + esc(dmy(m.sent)) + ' · ' + esc(m.subject) + ' · אל: ' + esc(m.to === 'כולם' ? 'כל הצוות' : (t.people.find(p => p.id === m.to) || {}).name || m.to) + ' · נקרא ע"י ' + m.readBy + '</div>').join('') : '') +
    '</div>';
  el.querySelectorAll('[data-tw]').forEach(b => b.onclick = () => { TEAM_WEEK = b.dataset.tw; renderTeam(el); });
  $('#m_send').onclick = async () => {
    const sub = $('#m_sub').value.trim(), body = $('#m_body').value.trim();
    if (!sub || !body) return toast('יש למלא נושא ותוכן', true);
    $('#m_send').disabled = true;
    try { await call('sendMessage', { to: $('#m_to').value, subject: sub, body }); toast('ההודעה נשלחה'); renderTeam(el); }
    catch (e) { toast(e.message, true); $('#m_send').disabled = false; }
  };
}

async function start() {
  if (INVALID) { $('#main').innerHTML = '<div class="center">הקישור אינו תקף. יש לפתוח את הקישור האישי שקיבלת מהמנהל.</div>'; return; }
  try { ME = await call('me'); } catch (e) { $('#main').innerHTML = '<div class="center">' + esc(e.message) + '</div>'; return; }
  COUNTS = ME.counts; UNREAD = ME.unread || 0;
  $('#who').textContent = 'שלום, ' + ME.name;
  const tabs = TABS.filter(canSee);
  if (!tabs.length) { $('#main').innerHTML = '<div class="center">עדיין לא הוגדר לך תפקיד בפורטל. פנה/י ללאו.</div>'; return; }
  let saved = null; try { saved = localStorage.getItem('portal_view'); } catch (e) {}
  const work = tabs.filter(t => t.id !== 'me');
  go(UNREAD ? 'me' : (tabs.some(t => t.id === saved) ? saved : (work[0] || tabs[0]).id));
  setInterval(() => { if (!BUSY && !$('#modal').classList.contains('on') && VIEW !== 'manage' && VIEW !== 'me') reload(true); }, 60000);
  try { window.top.postMessage({ nochejut: 'ready' }, '*'); } catch (e) {}
}
start();
